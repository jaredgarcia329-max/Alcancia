<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banco Escolar - Alcancía Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e6f7f7',
                            100: '#cceeee',
                            500: '#008b8b',
                            600: '#007070',
                            700: '#005858',
                            800: '#003e3e',
                            900: '#002525',
                            dark: '#081c24'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1f27;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Realistic Card Styling */
        .credit-card {
            background: linear-gradient(135deg, #0b2b30 0%, #005c50 50%, #002229 100%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 2px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .credit-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
        }
        .card-chip {
            background: linear-gradient(135deg, #e9c38c 0%, #b89146 100%);
            border: 1px solid #d4af37;
            border-radius: 6px;
            position: relative;
        }
        .card-chip::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 50%;
            border-top: 1px solid rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(0,0,0,0.2);
        }
        /* Smooth Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Glassmorphism Elements */
        .glass-card {
            background: rgba(18, 38, 48, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
        }
    </style>
</head>

                <i class="fa-solid fa-wifi"></i>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="p-5 flex-1 flex flex-col justify-between">
